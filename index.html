<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Snake Crawl Files</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#F5F2EB; color:#3E2723; font-family:system-ui,sans-serif; }
    main { width:min(680px,calc(100% - 40px)); text-align:center; padding:40px; background:#EFEAE0; border:1px solid #C2A67D; border-radius:18px; box-sizing:border-box; }
    h1 { margin-top:0; } p { line-height:1.6; }
    .download { display:inline-block; padding:14px 28px; border-radius:10px; background:#3E2723; color:white; text-decoration:none; font-weight:700; margin:12px 0; }
    .download:hover { opacity:.9; }
    code { background:#F5F2EB; padding:3px 6px; border-radius:5px; }
  </style>
</head>
<body>
  <main>
    <h1>Snake Crawl Files</h1>
    <p>The current <code>DATA.CSV</code> dataset synchronized from <strong>snake-crawl</strong>.</p>
    <a class="download" href="/api/download" download>DOWNLOAD DATA.CSV</a>
    <p>Direct file URL: <code>/api/download</code></p>
    <p>Downloads are available to browsers, scripts and bots. Each client is limited to one download every 5 minutes.</p>
  </main>
</body>
</html>
